name: Build ESPWebDAV (ESP8266)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Ручной запуск

jobs:
  build:
    name: Compile for ESP8266
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Раскомментируй строку ниже, если makeEspArduino.mk подключен как сабмодуль (submodule)
        # submodules: recursive

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh

      - name: Setup Arduino Core for ESP8266
        run: |
          ./bin/arduino-cli config init
          ./bin/arduino-cli core update-index
          # Добавляем ссылку на ядра ESP8266
          ./bin/arduino-cli config set board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          # Устанавливаем ядро ESP8266
          ./bin/arduino-cli core install esp8266:esp8266

      - name: Run Make (makeEspArduino)
        run: make

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp8266_firmware
          # makeEspArduino по умолчанию складывает всё в папку build/
          path: build/*.bin
          if-no-files-found: warn
