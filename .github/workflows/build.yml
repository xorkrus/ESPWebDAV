name: Build ESPWebDAV (Arduino CLI)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh

      - name: Setup ESP8266 Core (Legacy 2.7.4)
        run: |
          ./bin/arduino-cli config init
          ./bin/arduino-cli core update-index
          ./bin/arduino-cli config set board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          # УСТАНАВЛИВАЕМ СТАРУЮ ВЕРСИЮ 2.7.4, С КОТОРОЙ СОВМЕСТИМ КОД
          ./bin/arduino-cli core install esp8266:esp8266@2.7.4

      - name: Install dependencies
        run: |
          ./bin/arduino-cli lib install "WebSockets"

      - name: Compile Sketch
        run: |
          ./bin/arduino-cli compile --fqbn esp8266:esp8266:generic ESPWebDAV.ino

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp8266_firmware
          # В версии 2.7.4 папка билда называется немного иначе
          path: build/esp8266.esp8266.generic/ESPWebDAV.ino.bin
          if-no-files-found: warn
