name: Build ESPWebDAV

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Позволяет запустить сборку вручную через кнопку в GitHub

jobs:
  build:
    name: Build for ${{ matrix.environment }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false # Если одна платформа упадет, другие продолжат сборку
      matrix:
        # Укажи здесь названия environments из твоего файла platformio.ini
        # Обычно для этого проекта используются esp32dev и esp12e (ESP8266)
        environment:
          - esp8525

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
            .pio/cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware_${{ matrix.environment }}
          # Путь к скомпилированным файлам. 
          # В PlatformIO они лежат в папке .pio/build/<имя_окружения>/
          path: |
            .pio/build/${{ matrix.environment }}/firmware.bin
            .pio/build/${{ matrix.environment }}/partitions.bin
          if-no-files-found: error
